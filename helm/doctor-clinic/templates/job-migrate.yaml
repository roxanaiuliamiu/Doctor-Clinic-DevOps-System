apiVersion: batch/v1
kind: Job
metadata:
  name: doctor-clinic-migrate
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              until php -r 'try { new PDO("mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); echo "MySQL ready\n"; exit(0); } catch (Exception $e) { fwrite(STDERR, "Waiting for MySQL...\n"); exit(1); }'; do
                sleep 5
              done
              php artisan migrate --force
          env:
            - name: DB_HOST
              value: {{ .Values.app.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.app.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.app.env.DB_DATABASE | quote }}
            - name: DB_USERNAME
              value: {{ .Values.app.env.DB_USERNAME | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-clinic-secret
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: doctor-clinic-secret
                  key: APP_KEY