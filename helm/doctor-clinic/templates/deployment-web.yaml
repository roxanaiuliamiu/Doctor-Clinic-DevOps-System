apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-clinic-web
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: doctor-clinic-web
  template:
    metadata:
      labels:
        app: doctor-clinic-web
    spec:
      volumes:
        - name: app-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config

      initContainers:
        - name: init-copy-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp -r /var/www/. /shared-app/
              chown -R www-data:www-data /shared-app/storage /shared-app/bootstrap/cache || true
          volumeMounts:
            - name: app-files
              mountPath: /shared-app

      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /var/www/.env.example /var/www/.env || true

              grep -q '^APP_KEY=' /var/www/.env && sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" /var/www/.env || echo "APP_KEY=${APP_KEY}" >> /var/www/.env
              grep -q '^SESSION_DRIVER=' /var/www/.env && sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=file|" /var/www/.env || echo "SESSION_DRIVER=file" >> /var/www/.env
              grep -q '^CACHE_STORE=' /var/www/.env && sed -i "s|^CACHE_STORE=.*|CACHE_STORE=file|" /var/www/.env || echo "CACHE_STORE=file" >> /var/www/.env

              grep -q '^DB_CONNECTION=' /var/www/.env && sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|" /var/www/.env || echo "DB_CONNECTION=mysql" >> /var/www/.env
              grep -q '^DB_HOST=' /var/www/.env && sed -i "s|^DB_HOST=.*|DB_HOST=${DB_HOST}|" /var/www/.env || echo "DB_HOST=${DB_HOST}" >> /var/www/.env
              grep -q '^DB_PORT=' /var/www/.env && sed -i "s|^DB_PORT=.*|DB_PORT=${DB_PORT}|" /var/www/.env || echo "DB_PORT=${DB_PORT}" >> /var/www/.env
              grep -q '^DB_DATABASE=' /var/www/.env && sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${DB_DATABASE}|" /var/www/.env || echo "DB_DATABASE=${DB_DATABASE}" >> /var/www/.env
              grep -q '^DB_USERNAME=' /var/www/.env && sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${DB_USERNAME}|" /var/www/.env || echo "DB_USERNAME=${DB_USERNAME}" >> /var/www/.env
              grep -q '^DB_PASSWORD=' /var/www/.env && sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" /var/www/.env || echo "DB_PASSWORD=${DB_PASSWORD}" >> /var/www/.env

              php artisan config:clear
              php artisan cache:clear || true
              php-fpm -F
          env:
            - name: APP_ENV
              value: {{ .Values.app.env.APP_ENV | quote }}
            - name: APP_DEBUG
              value: {{ .Values.app.env.APP_DEBUG | quote }}
            - name: APP_URL
              value: {{ .Values.app.env.APP_URL | quote }}
            - name: DB_HOST
              value: {{ .Values.app.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.app.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.app.env.DB_DATABASE | quote }}
            - name: DB_USERNAME
              value: {{ .Values.app.env.DB_USERNAME | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-clinic-secret
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: doctor-clinic-secret
                  key: APP_KEY
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: app-files
              mountPath: /var/www

        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-files
              mountPath: /var/www
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf