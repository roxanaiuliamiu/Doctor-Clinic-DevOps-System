apiVersion: v1
kind: Secret
metadata:
  name: doctor-clinic-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  APP_KEY: {{ .Values.secret.APP_KEY | b64enc }}
  DB_PASSWORD: {{ .Values.secret.DB_PASSWORD | b64enc }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.MYSQL_ROOT_PASSWORD | b64enc }}