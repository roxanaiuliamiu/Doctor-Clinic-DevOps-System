namespace: default

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

app:
  replicaCount: 2
  env:
    APP_NAME: "Doctor Clinic"
    APP_ENV: local
    APP_DEBUG: "false"
    APP_URL: "http://localhost"
    DB_CONNECTION: "mysql"
    DB_HOST: "mysql"
    DB_PORT: "3306"
    DB_DATABASE: "doctors_db"
    DB_USERNAME: "doctors_user"

dbImport:
  enabled: true
  sqlFile: "DB_Doctors_Clinic_DevOps_System.sql"
  dropDatabase: false

service:
  web:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080
  mysql:
    type: ClusterIP
    port: 3306
    targetPort: 3306

php:
  targetPort: 9000

mysql:
  image: "mysql:8.0"
  database: "doctors_db"
  user: "doctors_user"

secret:
  APP_KEY: ""
  DB_PASSWORD: ""
  MYSQL_ROOT_PASSWORD: ""

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 2Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: doctor-clinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []