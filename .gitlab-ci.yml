stages:
  - test
  - build

variables:
  IMAGE_NAME: "registry.gitlab.com/miulina/doctor-clinic-devops-system"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

test:
  stage: test
  tags:
    - docker
    - ci
  image: php:8.2-cli
  before_script:
    - apt-get update
    - apt-get install -y git curl unzip libzip-dev zip nodejs npm
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  script:
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - npm install
    - npm run build
    - php artisan key:generate
    - php artisan test
  only:
    - main
    - dev
    - merge_requests

build:
  stage: build
  tags:
    - docker
    - ci
  image: docker:24
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
  only:
    - main
    - dev