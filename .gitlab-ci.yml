stages:
  - test
  - build
  - deploy_dev
  - deploy_prod

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/doctor-clinic-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

cache:
  paths:
    - vendor/
    - node_modules/

test:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y git unzip curl libzip-dev libpng-dev libicu-dev libonig-dev default-mysql-client
    - docker-php-ext-install pdo pdo_mysql mbstring bcmath zip intl
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    - cp .env.example .env || true
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - php artisan key:generate
  script:
    - php artisan test
  only:
    - dev
    - main
    - merge_requests

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
  only:
    - dev
    - main

deploy_dev:
  stage: deploy_dev
  image:
    name: alpine/helm:3.15.2
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_DEV" | base64 -d > ~/.kube/config
    - helm version
  script:
    - helm upgrade --install doctor-clinic-dev ./helm/doctor-clinic -n doctor-clinic-dev --create-namespace -f ./helm/doctor-clinic/values-dev.yaml --set image.repository="$IMAGE_NAME" --set image.tag="$IMAGE_TAG"
  only:
    - dev

deploy_prod:
  stage: deploy_prod
  image:
    name: alpine/helm:3.15.2
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_PROD" | base64 -d > ~/.kube/config
    - helm version
  script:
    - helm upgrade --install doctor-clinic-prod ./helm/doctor-clinic -n doctor-clinic-prod --create-namespace -f ./helm/doctor-clinic/values-prod.yaml --set image.repository="$IMAGE_NAME" --set image.tag="$IMAGE_TAG"
  only:
    - main
  when: manual