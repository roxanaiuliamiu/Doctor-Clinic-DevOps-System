stages:
  - test
  - build
  - deploy_dev
  - deploy_prod

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/doctor-clinic-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

test:
  stage: test
  tags:
    - docker
    - ci
  script:
    - docker --version
    - docker run --rm php:8.2-cli php -v
    - docker run --rm composer:2 composer --version
  only:
    - dev
    - main

build:
  stage: build
  tags:
    - docker
    - ci
  script:
    - docker --version
    - echo "$env:CI_JOB_TOKEN" | docker login -u "gitlab-ci-token" "$env:CI_REGISTRY" --password-stdin
    - docker build -t "$env:IMAGE_NAME:$env:IMAGE_TAG" .
    - docker push "$env:IMAGE_NAME:$env:IMAGE_TAG"
  only:
    - dev
    - main

deploy_dev:
  stage: deploy_dev
  tags:
    - docker
    - ci
  script:
    - |
      if (-not $env:KUBE_CONFIG_DEV) {
        throw "KUBE_CONFIG_DEV is not set"
      }
      echo "$env:KUBE_CONFIG_DEV" | Out-File -Encoding ascii kubeconfig-dev.b64
      $content = Get-Content kubeconfig-dev.b64 -Raw
      [System.IO.File]::WriteAllBytes("kubeconfig-dev.yaml", [System.Convert]::FromBase64String($content))
      $env:KUBECONFIG = "$PWD\kubeconfig-dev.yaml"
      kubectl version --client
      helm version
      helm lint ./helm/doctor-clinic -f ./helm/doctor-clinic/values.yaml -f ./helm/doctor-clinic/values-dev.yaml
      helm upgrade --install doctor-clinic ./helm/doctor-clinic -n doctor-clinic-dev --create-namespace -f ./helm/doctor-clinic/values.yaml -f ./helm/doctor-clinic/values-dev.yaml --set image.repository="$env:IMAGE_NAME" --set image.tag="$env:IMAGE_TAG"
      kubectl rollout status deployment/doctor-clinic-web -n doctor-clinic-dev --timeout=180s
      kubectl rollout status deployment/mysql -n doctor-clinic-dev --timeout=180s
      kubectl get all -n doctor-clinic-dev
  only:
    - dev

deploy_prod:
  stage: deploy_prod
  tags:
    - docker
    - ci
  script:
    - |
      if (-not $env:KUBE_CONFIG_PROD) {
        throw "KUBE_CONFIG_PROD is not set"
      }
      echo "$env:KUBE_CONFIG_PROD" | Out-File -Encoding ascii kubeconfig-prod.b64
      $content = Get-Content kubeconfig-prod.b64 -Raw
      [System.IO.File]::WriteAllBytes("kubeconfig-prod.yaml", [System.Convert]::FromBase64String($content))
      $env:KUBECONFIG = "$PWD\kubeconfig-prod.yaml"
      kubectl version --client
      helm version
      helm lint ./helm/doctor-clinic -f ./helm/doctor-clinic/values.yaml -f ./helm/doctor-clinic/values-prod.yaml
      helm upgrade --install doctor-clinic ./helm/doctor-clinic -n doctor-clinic-prod --create-namespace -f ./helm/doctor-clinic/values.yaml -f ./helm/doctor-clinic/values-prod.yaml --set image.repository="$env:IMAGE_NAME" --set image.tag="$env:IMAGE_TAG"
      kubectl rollout status deployment/doctor-clinic-web -n doctor-clinic-prod --timeout=180s
      kubectl rollout status deployment/mysql -n doctor-clinic-prod --timeout=180s
      kubectl get all -n doctor-clinic-prod
  when: manual
  only:
    - main