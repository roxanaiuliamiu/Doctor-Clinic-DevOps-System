stages:
  - ci_image
  - deploy_image
  - test
  - build
  - deploy_dev

variables:
  IMAGE_NAME: "registry.gitlab.com/miulina/doctor-clinic-devops-system"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  CI_IMAGE_NAME: "registry.gitlab.com/miulina/doctor-clinic-devops-system/ci"
  CI_IMAGE_TAG: "php82-node"
  DEPLOY_IMAGE_NAME: "registry.gitlab.com/miulina/doctor-clinic-devops-system/deploy"
  DEPLOY_IMAGE_TAG: "kubectl-helm"

build_ci_image:
  stage: ci_image
  tags:
    - docker
    - ci
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build -f Dockerfile.ci -t "$CI_IMAGE_NAME:$CI_IMAGE_TAG" .
    - docker push "$CI_IMAGE_NAME:$CI_IMAGE_TAG"
  only:
    - main

build_deploy_image:
  stage: deploy_image
  tags:
    - docker
    - ci
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build -f Dockerfile.deploy -t "$DEPLOY_IMAGE_NAME:$DEPLOY_IMAGE_TAG" .
    - docker push "$DEPLOY_IMAGE_NAME:$DEPLOY_IMAGE_TAG"
  only:
    - main

test:
  stage: test
  tags:
    - docker
    - ci
  image: "registry.gitlab.com/miulina/doctor-clinic-devops-system/ci:php82-node"
  script:
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - npm install
    - npm run build
    - php artisan key:generate
    - php artisan test
  only:
    - main
    - dev
    - merge_requests

build:
  stage: build
  tags:
    - docker
    - ci
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
  only:
    - main
    - dev

deploy_dev:
  stage: deploy_dev
  tags:
    - docker
    - ci
  image: "registry.gitlab.com/miulina/doctor-clinic-devops-system/deploy:kubectl-helm"
  before_script:
    - echo "$KUBE_CONFIG_DEV" | base64 -d > kubeconfig.yaml
    - chmod 600 kubeconfig.yaml
    - export KUBECONFIG="$CI_PROJECT_DIR/kubeconfig.yaml"
    - kubectl version --client
    - helm version
    - kubectl get ns
  script:
    - helm upgrade --install doctor-clinic-dev ./helm/doctor-clinic -n doctor-clinic-dev --create-namespace -f ./helm/doctor-clinic/values-dev.yaml --set image.repository="$IMAGE_NAME" --set image.tag="$IMAGE_TAG"
  only:
    - dev