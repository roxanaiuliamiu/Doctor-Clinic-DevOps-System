stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/miulina/doctor-clinic-devops-system/doctor-clinic-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

test:
  stage: test
  tags:
    - docker
    - ci
  script:
    - cp .env.example .env
    - docker build -t doctor-clinic-test .
    - docker run --rm doctor-clinic-test sh -c "php artisan key:generate --force && php artisan test"
  only:
    - dev
    - main

build:
  stage: build
  tags:
    - docker
    - ci
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
  only:
    - dev
    - main

deploy_dev:
  stage: deploy
  tags:
    - internal
    - k8s
  variables:
    KUBECONFIG: /home/gitlab-runner/.kube/config
  script:
    - kubectl get nodes
    - kubectl delete job doctor-clinic-migrate -n doctor-clinic-dev --ignore-not-found=true || true
    - kubectl delete job doctor-clinic-db-import -n doctor-clinic-dev --ignore-not-found=true || true
    - >
      helm upgrade --install doctor-clinic ./helm/doctor-clinic
      -n doctor-clinic-dev
      --create-namespace
      -f ./helm/doctor-clinic/values.yaml
      --set-string image.repository="$IMAGE_NAME"
      --set-string image.tag="$IMAGE_TAG"
      --set-string secret.APP_KEY="$APP_KEY"
      --set-string secret.DB_PASSWORD="$DB_PASSWORD"
      --set-string secret.MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD"
    - kubectl rollout status deployment/mysql -n doctor-clinic-dev --timeout=180s
    - |
      if kubectl get job doctor-clinic-db-import -n doctor-clinic-dev >/dev/null 2>&1; then
        kubectl wait --for=condition=complete job/doctor-clinic-db-import -n doctor-clinic-dev --timeout=300s
      else
        echo "doctor-clinic-db-import job not found in dev; skipping wait"
      fi
    - |
      if kubectl get job doctor-clinic-migrate -n doctor-clinic-dev >/dev/null 2>&1; then
        kubectl wait --for=condition=complete job/doctor-clinic-migrate -n doctor-clinic-dev --timeout=300s
      else
        echo "doctor-clinic-migrate job not found in dev; skipping wait"
      fi
    - kubectl rollout status deployment/doctor-clinic-web -n doctor-clinic-dev --timeout=180s
    - kubectl logs -n doctor-clinic-dev job/doctor-clinic-db-import || true
    - kubectl logs -n doctor-clinic-dev job/doctor-clinic-migrate || true
    - kubectl get all -n doctor-clinic-dev
  only:
    - dev

deploy_prod:
  stage: deploy
  tags:
    - internal
    - k8s
    - prod
  variables:
    KUBECONFIG: /home/gitlab-runner/.kube/config
  script:
    - kubectl get nodes
    - kubectl delete job doctor-clinic-migrate -n doctor-clinic-prod --ignore-not-found=true || true
    - >
      helm upgrade --install doctor-clinic ./helm/doctor-clinic
      -n doctor-clinic-prod
      --create-namespace
      -f ./helm/doctor-clinic/values.yaml
      -f ./helm/doctor-clinic/values-prod.yaml
      --set-string image.repository="$IMAGE_NAME"
      --set-string image.tag="$IMAGE_TAG"
      --set-string secret.APP_KEY="$APP_KEY"
      --set-string secret.DB_PASSWORD="$DB_PASSWORD"
      --set-string secret.MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD"
    - kubectl rollout status deployment/mysql -n doctor-clinic-prod --timeout=180s
    - |
      if kubectl get job doctor-clinic-migrate -n doctor-clinic-prod >/dev/null 2>&1; then
        kubectl wait --for=condition=complete job/doctor-clinic-migrate -n doctor-clinic-prod --timeout=300s
      else
        echo "doctor-clinic-migrate job not found in prod; skipping wait"
      fi
    - kubectl rollout status deployment/doctor-clinic-web -n doctor-clinic-prod --timeout=180s
    - kubectl logs -n doctor-clinic-prod job/doctor-clinic-migrate || true
    - kubectl get all -n doctor-clinic-prod
  only:
    - main